name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu"
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            args: "--target aarch64-unknown-linux-gnu"
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Snapshot the hand-written release title and body BEFORE tauri-action
      # runs. We feed them straight back to tauri-action (releaseName /
      # releaseBody) so whatever it writes back is identical to what we read —
      # the notes you wrote in the GitHub UI are preserved, and latest.json's
      # `notes` field (which tauri-action reads from this release body) carries
      # the same text. Reading is idempotent across the concurrent matrix jobs
      # since every job re-reads the same values up front.
      - name: Read existing release title and notes
        id: release_meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Force bash on every OS: the command substitution + heredoc below are
        # bash syntax, which the Windows runner's default shell (PowerShell) can't run.
        shell: bash
        run: |
          # title (single line) → steps.release_meta.outputs.name
          name="$(gh release view '${{ github.ref_name }}' --json name --jq '.name')"
          # body (multiline) → steps.release_meta.outputs.body
          body="$(gh release view '${{ github.ref_name }}' --json body --jq '.body')"
          {
            echo "name=$name"
            # multiline value: use the delimiter form so newlines survive
            echo "body<<BODY_EOF"
            echo "$body"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # Publishes signed updater bundles (.tar.gz / .nsis + .sig) and the
      # `latest.json` manifest the Tauri updater downloads. The signing key
      # comes from repo secrets (see docs/UPDATES.md).
      - name: Build tauri app and upload artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          # Echo back the exact title/notes we snapshotted above so the action's
          # internal release update is a no-op on metadata — only assets change.
          releaseName: ${{ steps.release_meta.outputs.name }}
          releaseBody: ${{ steps.release_meta.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  sync-to-gitee:
      needs: publish-tauri
      runs-on: ubuntu-latest
      if: always()
      steps:
        - name: Sync GitHub Release to Gitee
          uses: trustedinster/sync-release-gitee@v1.3
          with:
            gitee_owner: ricky-tap
            gitee_repo: lumina-terminal
            gitee_token: ${{ secrets.GITEE_TOKEN }}
            github_owner: iewnfod
            github_repo: lumina-terminal
            gitee_upload_retry_times: 3
            debug: false

        # tauri-action's latest.json has download URLs hard-coded to GitHub
        # (https://github.com/.../releases/download/...). For China users we
        # serve a SEPARATE manifest from Gitee (latest-cn.json, reachable via the
        # Gitee `latest` route) whose download URLs point at Gitee, so the
        # multi-MB bundle download also stays domestic. This fetches the GitHub
        # manifest, rewrites every `url` from github.com → gitee.com, and uploads
        # it as latest-cn.json on the Gitee release.
        - name: Generate Gitee-native manifest (latest-cn.json)
          env:
            GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
            GITHUB_REF_NAME: ${{ github.ref_name }}
          shell: bash
          run: |
            set -euo pipefail
            OWNER="ricky-tap"
            REPO="lumina-terminal"
            TAG="$GITHUB_REF_NAME"

            # Find the Gitee release id for this tag.
            release_id="$(curl -fsSL \
              "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases/tags/${TAG}" \
              | jq -r '.id')"
            if [[ -z "$release_id" || "$release_id" == "null" ]]; then
              echo "::warning::Gitee release for tag ${TAG} not found; skipping Gitee manifest."
              exit 0
            fi
            echo "Gitee release id: $release_id"

            # Download the GitHub manifest.
            if ! curl -fsSL -o latest.json \
              "https://github.com/iewnfod/lumina-terminal/releases/download/${TAG}/latest.json"; then
              echo "::warning::latest.json not found on GitHub release; skipping."
              exit 0
            fi

            # Rewrite every download URL: github.com/.../releases/download/<tag>/<file>
            # → gitee.com/<owner>/<repo>/releases/download/<tag>/<file>
            jq --arg owner "$OWNER" --arg repo "$REPO" --arg tag "$TAG" '
              .platforms |= with_entries(
                .value.url |= sub(
                  "https://github\\.com/[^/]+/[^/]+/releases/download/[^/]+/";
                  "https://gitee.com/\($owner)/\($repo)/releases/download/\($tag)/"
                )
              )
            ' latest.json > latest-cn.json

            echo "=== rewritten latest-cn.json ==="
            cat latest-cn.json

            # Upload to the Gitee release as an attachment. Use a distinct name so
            # it never collides with the mirrored (GitHub-pointing) latest.json.
            curl -fsSL -X POST \
              "https://gitee.com/api/v5/repos/${OWNER}/${REPO}/releases/${release_id}/attach_files" \
              -H "Content-Type: multipart/form-data" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@latest-cn.json" \
              | jq -r '.browser_download_url // "(upload ok)"' \
              | xargs -I{} echo "Uploaded Gitee manifest: {}"
